# CiteMatch v2.3.2 — Nature Review Profile
profile:
  name: "nature_review"
  version: "2.3.2"
  description: "Nature-family journal review — ultra-strict quality gates"

if_gate:
  body:
    enabled: true
    default_threshold: 15
    require_confirmation: true
  table:
    enabled: true
    default_threshold: 20
    require_confirmation: true

review_paper:
  introduction_only: true
  forbidden_in_quantitative_claims: true
  forbidden_in_results: true

density:
  sentence:
    max: 2
  paragraph:
    normal_max: 6
    review_max: 12

zones:
  abstract:
    new_citation: false
  figure_caption:
    migrate_existing: true
    allow_new_injection: false
  table:
    migrate_existing: true
    elite_if_gate: true
  code_block:
    allow_injection: false
    allow_migration: false

semantic:
  min_similarity_threshold: 0.25
  rejected_sections: ["abstract", "摘要", "keywords", "关键词"]
  this_work_patterns:
    - "this work"
    - "this paper"
    - "this study"
    - "this review"
    - "we propose"
    - "we develop"
    - "we present"
    - "we introduce"
    - "we demonstrate"

sections:
  introduction_keywords: ["introduction", "引言", "background", "背景"]
  results_keywords: ["results", "结果", "discussion", "讨论"]
  quantitative_claim_patterns:
    - "achieves? \\d+"
    - "sensitivity of \\d+"
    - "accuracy of \\d+"
    - "\\d+ kPa"
    - "\\d+ mmHg"
    - "\\d+ %"
    - "\\d+ dB"
    - "performance of"
    - "demonstrates? \\d+"
    - "outperforms?"

contribution_routing:
  material:    ["material", "材料", "3.1", "piezoelectric", "piezoresistive", "capacitive", "iontronic", "triboelectric", "optical"]
  fabrication: ["fabrication", "制备", "3.2", "printing", "lithography", "electrospinning", "textile", "fiber"]
  algorithm:   ["algorithm", "machine learning", "deep learning", "2.1", "signal processing", "pulse wave", "neural", "transfer learning"]
  clinical:    ["clinical", "4.1", "4.2", "application", "healthcare", "monitoring", "surgery", "icu", "daily"]
